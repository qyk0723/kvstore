name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Builds with the real epoll backend and runs the whole suite on Linux.
  # This covers what cannot be verified on a Windows-only machine, where the
  # reactor falls back to a poll() backend.
  test:
    name: linux build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: run tests
        working-directory: cpp
        run: ./build/kv_tests

  # Reports Linux + epoll throughput.  A shared CI runner is noisy, so this is
  # a sanity check, not a number to quote.
  benchmark:
    name: linux epoll benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build cpp/build -j"$(nproc)"

      - name: start server
        working-directory: cpp
        run: |
          ./build/kvstore --port 9096 --engine hash --threads 2 --shards 64 > /tmp/kv.log 2>&1 &
          for i in $(seq 1 50); do
            if python3 -c "import socket; socket.create_connection(('127.0.0.1', 9096), 0.5).close()" 2>/dev/null; then
              echo "server is up"
              cat /tmp/kv.log
              exit 0
            fi
            sleep 0.2
          done
          echo "server failed to start"
          cat /tmp/kv.log
          exit 1

      - name: benchmark
        working-directory: cpp
        timeout-minutes: 5
        run: |
          ./build/kv_bench --port 9096 --threads 4 --requests 500000 \
            --pipeline 32 --keys 10000 --get-ratio 0.5

      - name: server log
        if: always()
        run: cat /tmp/kv.log
